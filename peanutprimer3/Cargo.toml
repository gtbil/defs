[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
peanutprimer3-core = { path = "core" }
primer3 = "0.1.0"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rust_xlsxwriter = "0.97"

# See vendor/primer3-sys-patched/build.rs for why: upstream unconditionally
# compiles masker.c, which doesn't build under mingw (Windows cross-compile).
[patch.crates-io]
primer3-sys = { path = "vendor/primer3-sys-patched" }
